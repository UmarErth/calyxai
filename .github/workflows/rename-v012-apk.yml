name: Rename v0.1.2 APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-v012-apk.yml']

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release download v0.1.2 --repo "$GITHUB_REPOSITORY" --pattern app-debug.apk
      - run: mv app-debug.apk calyx-uni0.1.2.apk
      - run: gh release delete-asset v0.1.2 app-debug.apk --repo "$GITHUB_REPOSITORY" --yes
      - run: gh release upload v0.1.2 calyx-uni0.1.2.apk --repo "$GITHUB_REPOSITORY"
