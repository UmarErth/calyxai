name: Build Calyx apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/calyx-uni${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Calyx-Android-APK
          path: android/app/build/outputs/apk/debug/calyx-uni*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run desktop:windows
            artifact: Calyx-Windows
            path: |
              release/*.exe
              release/*.yml
              release/*.blockmap
          - os: ubuntu-latest
            command: npm run desktop:linux
            artifact: Calyx-Linux
            path: |
              release/*.AppImage
              release/*.yml
              release/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Calyx ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Calyx-Android-APK/*.apk
            artifacts/Calyx-Windows/*.exe
            artifacts/Calyx-Windows/*.yml
            artifacts/Calyx-Windows/*.blockmap
            artifacts/Calyx-Linux/*.AppImage
            artifacts/Calyx-Linux/*.yml
            artifacts/Calyx-Linux/*.blockmap
