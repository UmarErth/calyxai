Name: Calyx
Summary: A focused open-source AI workspace
Description: |-
  Calyx is an independent AI workspace for research, writing, decisions,
  attachments, and deliberate problem solving. It includes multiple reasoning
  profiles, customizable themes, website reading, and secure account support.

  The Android client is open source. AI requests use the Calyx hosted service
  and require network access.

